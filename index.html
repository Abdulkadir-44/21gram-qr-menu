<!DOCTYPE html>
<html lang="tr" data-group="yiyecek">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4032D">
<title>21 Gram Gastrobar — Menü</title>
<link rel="icon" href="/img/logo.png">
<link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bricolage-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/theme.css">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.6" fill="#FFFCEC" fill-opacity=".22"/></pattern>
    <!-- kokteyl kartı: kemerin üstündeki kavisli yazının yolu (kemer merkezi 150,167 · yarıçap 122) -->
    <path id="cocktailArc" d="M 39.4 115.4 A 122 122 0 0 1 260.6 115.4" fill="none"/>
    <!-- bira kartı: altlığın etrafındaki dairesel yazı (merkez 100,100 · yarıçap 80) -->
    <path id="coasterRing" d="M 100 100 m -80 0 a 80 80 0 1 1 160 0 a 80 80 0 1 1 -160 0" fill="none"/>
    <symbol id="burst" viewBox="0 0 200 200">
      <polygon points="100.0,4.0 112.0,16.9 127.0,7.9 134.9,23.6 151.9,19.2 155.0,36.5 172.6,37.1 170.7,54.6 187.3,60.1 180.6,76.3 195.0,86.3 184.0,100.0 195.0,113.7 180.6,123.7 187.3,139.9 170.7,145.4 172.6,162.9 155.0,163.5 151.9,180.8 134.9,176.4 127.0,192.1 112.0,183.1 100.0,196.0 88.0,183.1 73.0,192.1 65.1,176.4 48.1,180.8 45.0,163.5 27.4,162.9 29.3,145.4 12.7,139.9 19.4,123.7 5.0,113.7 16.0,100.0 5.0,86.3 19.4,76.3 12.7,60.1 29.3,54.6 27.4,37.1 45.0,36.5 48.1,19.2 65.1,23.6 73.0,7.9 88.0,16.9" fill="currentColor"/>
      <circle cx="100" cy="100" r="78" fill="url(#dots)"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#FFFCEC" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5"/>
    </symbol>
  </defs>
</svg>
<div id="bgfx" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>

<section id="welcome" aria-label="Karşılama">
  <h1 class="sr-only">21 Gram Gastrobar</h1>
  <img class="fb-logo" src="/img/logo.png" alt="21 Gram">
  <p class="w-sub" aria-hidden="true">Gastrobar</p>
  <button class="enter" id="enter" type="button">Menüyü aç
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <p class="w-hint" id="wHint">Logoyu sürükleyerek çevir</p>
</section>

<main id="app" class="is-hidden" aria-label="Menü">
  <div class="top-wrap"><div class="top">
    <button class="brand" id="home" type="button" aria-label="Açılış ekranına dön"><img src="/img/logo.png" alt="21 Gram"></button>
    <button class="icon-btn" id="searchBtn" type="button" aria-label="Menüde ara" aria-expanded="false" aria-controls="searchRow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
  </div></div>
  <div class="searchrow" id="searchRow"><label class="sr-only" for="q">Menüde ara</label><input id="q" type="search" placeholder="Menüde ara" autocomplete="off" enterkeyhint="search"></div>
  <div class="nav">
    <div class="nav-in">
      <div class="tabs" role="tablist" aria-label="Menü bölümleri" id="tabs"><span class="ind" id="ind"></span></div>
      <div class="chips" id="chips" role="group" aria-label="Kategoriler"></div>
    </div>
  </div>
  <h2 class="sr-only" id="listTitle"></h2>
  <div class="grid" id="grid"></div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sName">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel">
    <div class="hero" id="hero">
      <div class="hero-deco" id="heroDeco" aria-hidden="true"></div>
      <div class="plate" aria-hidden="true"></div>
      <div id="hpHost" style="display:contents"></div>
      <p class="hero-hint" aria-hidden="true">Sürükleyerek eğ</p>
      <button class="close" id="close" type="button" aria-label="Kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="info">
      <p class="cat" id="sCat"></p>
      <h2 class="name" id="sName"></h2>
      <p class="desc" id="sDesc"></p>
      <div class="s-extra" id="sExtra"></div>
      <p class="price big" id="sPrice"></p>
      <div class="pn">
        <button type="button" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Önceki</button>
        <button type="button" id="next">Sonraki<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script src="/vendor/three-r128.min.js"></script>
<script type="module" src="/src/app.js"></script>
</body>
</html>
